name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
    tags: ["*"]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Use Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Coursier cache
        uses: coursier/cache-action@v6
      - name: Check style
        run: nix develop --command just checkstyle

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Use Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Coursier cache
        uses: coursier/cache-action@v6
      - name: Build project
        run: nix develop --command just build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Use Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Coursier cache
        uses: coursier/cache-action@v6
      - name: Test project
        run: nix develop --command just test
