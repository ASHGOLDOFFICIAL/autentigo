app {
  name = "autentigo"
  version = "SNAPSHOT"
  host = "0.0.0.0"
  port = ${?APP_PORT}
}

postgres {
  uri = ${?POSTGRES_URL}
  user = ${?POSTGRES_USER}
  password = ${?POSTGRES_PASSWORD}
}

services {
  issuer = ${?JWT_ISSUER}
  key = ${?JWT_SECRET_KEY}
  access-expiration = 24h
  refresh-expiration = 30d
}
